name: Build ICQ New APK
on:
  push:
    branches: [icq-new-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build (everything logged)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            /tmp/gradle-8.9/bin/gradle :app:assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee /tmp/build.log
      - name: Publish result to branch icq-new-apk
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          if [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" icq-new.apk
            echo ok > STATUS
          else
            echo failed > STATUS
          fi
          tail -c 80000 /tmp/build.log > build.log 2>/dev/null || echo "no log" > build.log
          git init -q && git checkout -q -b icq-new-apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "ICQ New build ${GITHUB_SHA::7}: $(cat STATUS)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" icq-new-apk
